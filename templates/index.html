<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Waste Classifier</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f7fa;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-container {
            background-color: #fff;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        textarea {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: vertical;
            min-height: 150px;
            font-family: inherit;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn {
            background-color: #3498db;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .results-container {
            background-color: #fff;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .results-section {
            flex: 1;
            min-width: 300px;
        }
        .results-header {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            margin-bottom: 20px;
        }
        .category {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }
        .confidence {
            font-size: 18px;
            color: #7f8c8d;
        }
        .plot-container {
            margin-top: 20px;
            text-align: center;
        }
        .hazard-indicator {
            position: relative;
            width: 100%;
            height: 350px;
            margin: 0 auto;
        }
        .hazard-background {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
        }
        .hazard-marker {
            position: absolute;
            width: 60px;
            z-index: 2;
            left: 50%;
            transform: translateX(-80px);
            transition: top 1s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        .marker-high { top: 20px; }
        .marker-medium { top: 145px; }
        .marker-low { top: 270px; }
        .disposal-method {
            background-color: #ebf5fb;
            padding: 20px;
            border-radius: 6px;
            margin-top: 20px;
        }
        .disposal-method h4 {
            margin-top: 0;
            color: #2874a6;
        }
    </style>
</head>
<body>
    <h1>Medical Waste Classifier</h1>
    
    <div class="form-container">
        <form method="post">
            <textarea name="text" placeholder="Enter medical waste description..."></textarea>
            <button type="submit" class="btn">Classify Waste</button>
        </form>
    </div>

    {% if result %}
    <div class="results-container">
        <div class="results-section">
            <div class="results-header">
                <div class="category">{{ result.prediction }}</div>
                <div class="confidence">(Confidence: {{ result.confidence }})</div>
            </div>
            <div class="plot-container">
                <img src="data:image/png;base64,{{ result.confidence_plot }}" alt="Confidence Levels" style="max-width: 100%;">
            </div>
            
            <!-- Display disposal method -->
            <div class="disposal-method">
                <h4>Recommended Disposal Method:</h4>
                <p>{{ result.disposal_text }}</p>
            </div>
        </div>
        
        <div class="results-section">
            <h3>Hazard Level: {{ result.hazard_level }}</h3>
            <div class="hazard-indicator">
                <img class="hazard-background" src="data:image/png;base64,{{ result.hazard_plot.background }}" alt="Hazard Level Background">
                <img class="hazard-marker marker-{{ result.hazard_plot.target_position }}" src="data:image/png;base64,{{ result.hazard_plot.marker }}" alt="Hazard Level Indicator">
            </div>
        </div>
    </div>
    {% endif %}
    
    <script>
        // Add a small delay to apply the transition effect for hazard marker
        document.addEventListener('DOMContentLoaded', function() {
            const marker = document.querySelector('.hazard-marker');
            if (marker) {
                setTimeout(() => {
                    marker.style.transform = 'translateX(-80px)';
                }, 100);
            }
        });
    </script>
</body>
</html>
